# TC-CI.2.i 음성 대조: matrix.include 로 조각을 바꿈
# expect: stage-partition
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  p2-k2:
    name: 한도 분배 (K2 게이트, OmniRoute 3.8.51)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
        include:
          - shard: "3/2"
    steps:
      - name: K2 게이트
        run: node scripts/gate.mjs K2 --explain --shard ${{ matrix.shard }}
