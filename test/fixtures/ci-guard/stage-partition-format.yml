# TC-CI.2.j 음성 대조: --shard 값이 i/n 형식이 아님
# expect: stage-partition
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  p2-k2:
    name: 한도 분배 (K2 게이트, OmniRoute 3.8.51)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "all"]
    steps:
      - name: K2 게이트
        run: node scripts/gate.mjs K2 --explain --shard ${{ matrix.shard }}
