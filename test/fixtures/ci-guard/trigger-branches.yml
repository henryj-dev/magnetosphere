# TC-S7.T1.c 음성 대조: on.push.branches 에 main 외 값이 있다 (허용은 정확히 branches: [main] 하나)
# expect: trigger
name: ci
on:
  push:
    branches: [main, "release/**"]
  pull_request:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: S2 게이트
        run: node scripts/gate.mjs S2
