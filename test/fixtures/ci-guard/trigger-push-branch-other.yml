# TC-S7.T1.c 음성 대조: on.push.branches 가 main 이 아닌 브랜치 하나다
# expect: trigger
name: ci
on:
  push:
    branches: [develop]
  pull_request:
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: S2 게이트
        run: node scripts/gate.mjs S2
