# CI 매트릭스 (실행판 S7.T1, 2단계 실행판 0절 「CI 단계 잡 규칙」). 단계마다 그 단계의 게이트를 서비스를 띄운 잡에서 그대로 돈다 (node scripts/gate.mjs S<n>).
# 검사 정의는 gates/gates.config.mjs 하나뿐이라 CI 와 로컬 게이트가 어긋나지 않는다.
# - 테스트 DB·mailpit·계약 환경 OmniRoute·배포 묶음은 각 검사의 실행기가 docker compose 로 직접 띄운다 (잡에는 docker 만 있으면 된다).
# - 잡마다 러너가 따로라 포트가 겹치지 않는다. 무거운 묶음(배포·E2E)은 잡을 나눠 동시에 돈다.
# - 게이트에서 빼는 검사는 E2E 여섯(G-S6.9~14)뿐이다. 그 여섯은 e2e 매트릭스 잡이 조합마다 같은 명령으로 돈다.
# - S1 은 확인용 코드(spikes/)를 S7.T2 에서 지웠으므로 봉인 커밋을 꺼내 그 커밋의 코드로 돈다 (s1-seal 잡).
# scripts/check-ci-matrix.mjs (G-S7.1) 가 이 파일의 매트릭스·단계 잡·액션 SHA 고정을 검사한다.
# 액션은 커밋 SHA 로 고정한다 (주석은 그 SHA 의 태그).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # main 에서는 앞 실행을 취소하지 않는다. 봉인 커밋의 단계 게이트 결과가 남아야 한다 (K0.T3, check-ci-matrix [concurrency])
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: "0"
  WRANGLER_SEND_METRICS: "false"

jobs:
  unit:
    name: 단위 (S0 게이트·패키지 테스트·타입)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 스크립트 테스트
        run: node --test --test-reporter=tap "scripts/*.test.mjs"
      - name: S0 게이트
        run: node scripts/gate.mjs S0
      - name: 패키지 단위 테스트 (서비스 없이 도는 것 전부)
        run: |
          pnpm -C packages/db test
          pnpm -C packages/omniroute test
          pnpm -C packages/runtime test
          pnpm -C apps/server test
      - name: 타입 검사
        run: pnpm -r typecheck

  order:
    name: 순서·봉인 상태
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: 처음 커밋부터 순서 위반 없음
        run: node scripts/gate.mjs --assert-order --base "$(git rev-list --max-parents=0 HEAD)"
      - name: 단계 상태
        run: node scripts/gate.mjs --status

  schema:
    name: 스키마 (S2 게이트, 다섯 DB)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: S2 게이트
        run: node scripts/gate.mjs S2 --explain

  auth:
    name: 인증 (S3 게이트, 네 DB·mailpit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: S3 게이트
        run: node scripts/gate.mjs S3 --explain
      - name: packages/auth 테스트 전부
        run: pnpm -C packages/auth test && pnpm -C packages/auth test:smtp

  server:
    name: 서버·런타임 (S4 게이트)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: S4 게이트
        run: node scripts/gate.mjs S4 --explain

  contract:
    name: 계약 (S5 게이트, OmniRoute 3.8.51)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: S5 게이트
        run: node scripts/gate.mjs S5 --explain

  deploy:
    name: 배포 묶음 (S6 게이트, E2E 여섯은 e2e 잡)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: S6 게이트 (G-S6.9~14 는 e2e 매트릭스가 같은 명령으로 돈다)
        run: node scripts/gate.mjs S6 --explain --skip-ids G-S6.9,G-S6.10,G-S6.11,G-S6.12,G-S6.13,G-S6.14

  e2e:
    name: E2E ${{ matrix.combo }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        combo: [docker-sqlite, docker-mysql, docker-pg, workers-d1, workers-mysql, workers-pg]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 설치 → 관리자 → 부트스트랩 → 로그인
        run: pnpm e2e --combo ${{ matrix.combo }}

  guard:
    name: 재발 방지 (S7 게이트)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: S7 게이트
        run: node scripts/gate.mjs S7 --explain

  p2-k0:
    name: 장치·확인 (K0 게이트, OmniRoute 3.8.51)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 계약 환경 OmniRoute(20170)는 pnpm test:contract 가, 측정용 OmniRoute(20171)는 tests/bench/analytics.mjs 가 띄운다.
    # G-K0.31 은 gh api 로 main 규칙을 읽는다 (공개 저장소라 읽기 권한 토큰으로 읽힌다. 못 읽으면 검사가 실패한다).
    # G-K0.35·36 은 Red 커밋을 봉인 S7 뒤 이력에서 찾으므로 이력 전체가 필요하다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: K0 게이트
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gate.mjs K0 --explain
      - name: 분석 API 측정값 (확인 15번, G-K0.18 이 남긴 파일)
        run: cat "$RUNNER_TEMP/bench-analytics.json"

  p2-k1:
    name: 작업 기반 (K1 게이트, 네 DB)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # 테스트 DB(MySQL·MariaDB·Postgres)는 test:migrate·test:db 실행기가 docker compose 로 띄우고, 로컬 D1·wrangler dev 는 검사가 직접 띄운다.
    # G-K1.18 은 Red 커밋을 봉인 K0 뒤 이력에서 찾으므로 이력 전체가 필요하다. G-K1.21 은 gh api 로 main 규칙을 읽는다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: K1 게이트
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gate.mjs K1 --explain

  p2-k2:
    name: 한도 분배 (K2 게이트, OmniRoute 3.8.51)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 계약 환경 OmniRoute(20170)는 pnpm test:contract 가, 측정용 OmniRoute(20171)는 tests/bench/analytics.mjs --rebalance 가,
    # 테스트 DB(MySQL·MariaDB·Postgres)는 test:migrate 실행기가 docker compose 로 띄운다. G-K2.21 은 gh api 로 main 규칙을 읽는다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: K2 게이트
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gate.mjs K2 --explain

  s1-seal:
    name: 확인 항목 (S1 게이트, 봉인 커밋에서)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # S1 검사는 spikes/ 의 확인용 코드로 돈다. spikes/ 는 S7.T2 에서 지웠으므로 S1 봉인 커밋을 따로 꺼내 그 코드로 돈다.
    # 0단계의 시험용 OmniRoute(20140, 손으로 준비)는 같은 버전·같은 가짜 상위 서버를 붙인 계약 환경(20170)으로 대신한다.
    # 확인용 코드는 OMNI_URL·OMNI_PASSWORD 로 주소와 비밀번호를 받는다. Keycloak·DB 는 그 커밋의 up.sh 가 띄운다.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: 시험용 OmniRoute (계약 환경, 가짜 상위 서버 mko·mka)
        run: |
          docker compose -f tests/contract/docker-compose.yml up -d --wait
          node tests/contract/setup.mjs
      - name: S1 봉인 커밋 꺼내기
        run: |
          head=$(node -p 'require("./gates/seals/S1.json").head')
          git worktree add --detach "$RUNNER_TEMP/s1" "$head"
          echo "S1_ROOT=$RUNNER_TEMP/s1" >> "$GITHUB_ENV"
          # G-S1.4 가 읽는 V16 수집 로그(spikes/v16/paths.log)는 봉인 뒤 커밋에서야 저장소에 들어갔다 (그 전에는 이 컴퓨터에만 있었다).
          # 그 로그를 추가한 커밋(8af3175, 고정)에서 꺼내 봉인 커밋 작업 트리에 둔다. 커밋이나 파일이 없으면 이 스텝이 실패한다
          git show "8af317565f41ffc12d64464771a3a843c67ece4c:spikes/v16/paths.log" > "$RUNNER_TEMP/s1/spikes/v16/paths.log"
      - name: 확인용 코드 의존성
        working-directory: ${{ runner.temp }}/s1
        run: |
          pnpm -C spikes/v17 install --frozen-lockfile
          pnpm -C spikes/v26 install --frozen-lockfile
          # v27 은 자기 pnpm-workspace.yaml 이 없어 설치 스크립트 허용 목록이 없다 (pnpm 11 은 허용 안 된 빌드를 오류로 낸다).
          # 저장소 최상위와 같은 허용 목록(esbuild·workerd)을 그 폴더에 두고 설치한다
          printf 'allowBuilds:\n  esbuild: true\n  workerd: true\n' > spikes/v27/pnpm-workspace.yaml
          pnpm -C spikes/v27 install --frozen-lockfile
      - name: Keycloak·DB 띄우기 (V26·V27)
        working-directory: ${{ runner.temp }}/s1
        run: |
          bash spikes/v26/up.sh
          bash spikes/v27/up.sh
      - name: S1 게이트 (봉인 커밋의 설정·코드)
        env:
          OMNI_URL: http://127.0.0.1:20170
          OMNI_PASSWORD: contract-initial-password-5c1e9a
        run: node scripts/gate.mjs --root "$S1_ROOT" S1 --explain
