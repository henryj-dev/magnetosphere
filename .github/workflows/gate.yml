name: gate

on:
  push:
  pull_request:

# 액션은 커밋 SHA 로 고정한다 (주석은 그 SHA 의 태그). 토큰은 읽기 권한만 (S7 리뷰 M2)
permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: 게이트 장치 음성 대조
        run: node --test --test-reporter=tap "scripts/*.test.mjs"
      - name: 순서 위반 검사
        # PR 은 대상 브랜치와 갈라진 뒤, push 는 직전 커밋 뒤의 변경을 본다. pre-push 훅을 건너뛴 push 도 여기서 잡는다.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          elif git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            base="${{ github.event.before }}"
          else
            base=""
          fi
          if [ -n "$base" ]; then
            node scripts/gate.mjs --assert-order --base "$base"
          else
            node scripts/gate.mjs --assert-order
          fi
          echo "GATE_BASE=$base" >> "$GITHUB_ENV"
      - name: 봉인 검증 (바뀐 봉인은 봉인 커밋에서 검사를 다시 돌린다)
        # 시험용 OmniRoute·Keycloak·docker DB 가 필요한 검사(requires: local-services)는 여기서 건너뛰고,
        # S7 의 CI 매트릭스가 서비스를 띄워 다시 돈다.
        # G-K0.31(check-required-checks)이 gh api 로 main 규칙을 읽는다. gh 는 토큰이 없으면 실행을 거부한다
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GATE_BASE" ]; then
            node scripts/gate.mjs --verify-seals --rerun --since "$GATE_BASE" --skip-requires local-services
          else
            node scripts/gate.mjs --verify-seals --rerun --skip-requires local-services
          fi
