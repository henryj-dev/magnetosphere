# Magnetosphere Compose 설치 (실행판 S6.T2, 계획서 3.2·3.3·4.7·7장). 먼저 node scripts/init.mjs 로 .env 를 만든다.
#   docker compose up -d --wait                  SQLite (기본)
#   COMPOSE_PROFILES=mysql|postgres (.env)       MySQL·Postgres 프로필. init --db 가 DATABASE_URL 과 함께 넣는다
# 최초 설치는 app 인스턴스 하나로 한다 (deploy/README.md). 설치가 끝나면 .env.setup 을 지우고 app 을 다시 띄운다.
#
# 망: internal (모든 서비스) · edge (caddy ↔ app 만). app 은 edge 망에서 온 X-Forwarded-For 만 믿는다 (TRUSTED_PROXIES).
# 호스트에 여는 포트: Caddy 80·443, OmniRoute 대시보드는 127.0.0.1:20128 만 (SSH 터널로 접속). 그 밖의 OmniRoute 포트는 열지 않는다.
name: magnetosphere

x-db-health: &db-health
  interval: 2s
  timeout: 5s
  retries: 90

services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal, edge]
    depends_on:
      app:
        condition: service_healthy
      omniroute:
        condition: service_healthy

  # 커밋된 마이그레이션을 적용하고 끝나는 일회성 서비스. 서버는 마이그레이션을 직접 적용하지 않는다 (S4, TC-S6.T2.f)
  migrate:
    build: &app-build
      context: .
      dockerfile: apps/server/Dockerfile
    image: magnetosphere-app:${APP_TAG:-local}
    command: ["node", "apps/server/src/migrate.ts"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/magnetosphere.sqlite}
    volumes:
      - app-data:/data
    networks: [internal]
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      postgres:
        condition: service_healthy
        required: false

  app:
    build: *app-build
    image: magnetosphere-app:${APP_TAG:-local}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/data/magnetosphere.sqlite}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?node scripts/init.mjs 로 .env 를 먼저 만든다}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?node scripts/init.mjs 로 .env 를 먼저 만든다}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?node scripts/init.mjs 로 .env 를 먼저 만든다}
      OMNIROUTE_URL: http://omniroute:20128
      # Caddy 만 있는 edge 망. 이 밖의 상대가 보낸 X-Forwarded-For 는 무시하고 경고를 한 번 남긴다 (S4 보안 리뷰 M3)
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-10.203.57.0/29}
    # OMNIROUTE_INITIAL_PASSWORD 는 최초 설치 때만 .env.setup 으로 넘긴다. 파일을 지우고 다시 띄우면 사라진다 (S5 보안 리뷰 M2)
    env_file:
      - path: .env.setup
        required: false
    volumes:
      - app-data:/data
    networks:
      internal: {}
      edge:
        aliases: [app-edge]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 60
    depends_on:
      migrate:
        condition: service_completed_successfully
      omniroute:
        condition: service_healthy

  omniroute:
    # 계약 테스트(tests/contract)와 같은 버전·digest. 올릴 때는 계약 테스트가 통과해야 한다 (G-S5.13)
    image: diegosouzapw/omniroute:3.8.51@sha256:8bd462c9f60d8eda79329cfbb6ea7ea723505fe7721beb944f3d43835409e218
    restart: unless-stopped
    environment:
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?node scripts/init.mjs 로 .env 를 먼저 만든다}
      JWT_SECRET: ${JWT_SECRET:?node scripts/init.mjs 로 .env 를 먼저 만든다}
      API_KEY_SECRET: ${API_KEY_SECRET:?node scripts/init.mjs 로 .env 를 먼저 만든다}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?node scripts/init.mjs 로 .env 를 먼저 만든다}
      STORAGE_ENCRYPTION_KEY_VERSION: ${STORAGE_ENCRYPTION_KEY_VERSION:-v1}
      OMNIROUTE_WS_BRIDGE_SECRET: ${OMNIROUTE_WS_BRIDGE_SECRET:?node scripts/init.mjs 로 .env 를 먼저 만든다}
      # 이미지 기본값도 true 지만 OmniRoute .env.example 은 false 다. 명시한다 (V21)
      REQUIRE_API_KEY: "true"
      PRICING_SYNC_ENABLED: ${PRICING_SYNC_ENABLED:-true}
    # 대시보드는 루프백에만 연다. SSH 터널로 접속한다 (계획서 4.7 6번)
    ports:
      - "127.0.0.1:20128:20128"
    volumes:
      - omniroute-data:/app/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/livez').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 60

  mysql:
    image: mysql:8.0
    profiles: [mysql]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?node scripts/init.mjs --db mysql 로 .env 를 먼저 만든다}
      MYSQL_DATABASE: magnetosphere
      MYSQL_USER: magnetosphere
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?node scripts/init.mjs --db mysql 로 .env 를 먼저 만든다}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [internal]
    # 초기화 중 임시 서버도 ping 에는 답하므로 앱 계정으로 TCP 쿼리가 되는지 본다 (V26)
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P3306 -umagnetosphere -p\"$$MYSQL_PASSWORD\" magnetosphere -e 'SELECT 1'"]
      <<: *db-health

  postgres:
    image: postgres:14
    profiles: [postgres]
    restart: unless-stopped
    environment:
      POSTGRES_USER: magnetosphere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?node scripts/init.mjs --db postgres 로 .env 를 먼저 만든다}
      POSTGRES_DB: magnetosphere
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "psql", "-h127.0.0.1", "-Umagnetosphere", "-dmagnetosphere", "-c", "SELECT 1"]
      <<: *db-health

networks:
  internal: {}
  edge:
    ipam:
      config:
        - subnet: ${EDGE_SUBNET:-10.203.57.0/29}

volumes:
  app-data: {}
  omniroute-data: {}
  caddy-data: {}
  caddy-config: {}
  mysql-data: {}
  postgres-data: {}
